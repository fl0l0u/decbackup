name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel against a device vector
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/*.whl
          # must decrypt + verify silently, exit 0
          .venv-smoke/bin/decbackup -i tests/vectors/test.bkup \
              -o archive.tar -p testpass
          tar tf archive.tar > /dev/null
          # failure contract: wrong password must exit 1 and leave no file
          if .venv-smoke/bin/decbackup -i tests/vectors/test.bkup \
              -o /tmp/bad.out -p wrong; then
            echo "expected failure with wrong password" >&2; exit 1
          fi
          test ! -e /tmp/bad.out
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # idempotent re-runs of the same tag: files already on PyPI are
        # skipped instead of failing the job
        with:
          skip-existing: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
