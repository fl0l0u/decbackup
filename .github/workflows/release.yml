name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check tag matches package version
        # a drifted tag + skip-existing would silently no-op the publish
        # while the GitHub release still announces the tag's version
        run: |
          python -m pip install --upgrade pip
          # import needs the runtime deps; pip reads the floor from pyproject
          python -m pip install .
          test "v$(python -c 'import decbackup; print(decbackup.__version__)')" = "${GITHUB_REF_NAME}"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel against device vectors
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/*.whl
          # must decrypt + verify silently, exit 0
          .venv-smoke/bin/decbackup -i tests/vectors/test.bkup \
              -o archive.tar -p testpass
          tar tf archive.tar > /dev/null
          # failure contract: wrong password must exit 1 and leave no file
          if .venv-smoke/bin/decbackup -i tests/vectors/test.bkup \
              -o /tmp/bad.out -p wrong; then
            echo "expected failure with wrong password" >&2; exit 1
          fi
          test ! -e /tmp/bad.out
          # tampered certificate must exit 1 with the device's "failed (7)"
          if err=$(.venv-smoke/bin/decbackup -i tests/vectors/cert.bkup \
              -o /tmp/cert.out -p testpass 2>&1); then
            echo "expected failure on cert.bkup" >&2; exit 1
          fi
          echo "$err" | grep -q "failed (7)"
          test ! -e /tmp/cert.out
          # truncated input must exit 1 with the device's "failed (8)"
          if err=$(.venv-smoke/bin/decbackup -i tests/vectors/trunc.bkup \
              -o /tmp/trunc.out -p testpass 2>&1); then
            echo "expected failure on trunc.bkup" >&2; exit 1
          fi
          echo "$err" | grep -q "failed (8)"
          test ! -e /tmp/trunc.out
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # idempotent re-runs of the same tag: files already on PyPI are
        # skipped instead of failing the job
        with:
          skip-existing: true

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
